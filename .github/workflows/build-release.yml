name: Build Release APK

# KHP release build: signed with the KHP release keystore (GitHub secrets:
# KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
# Runs on push when this file changes (registers the workflow so
# workflow_dispatch works afterwards) and on manual workflow_dispatch.

on:
  push:
    branches:
      - khp-rebrand
    paths:
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.3.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Restore release keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore
        ls -l ${{ github.workspace }}/release.keystore

    - name: Build Release APK
      env:
        KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        # AGP 9.5.1 creates no testPlaystoreReleaseUnitTest task (release run
        # 45102131367 failed on task selection); the debug unit-test task runs
        # the same shared unit-test sources, so gate the release on it.
        # Capture the Gradle log: on failure, surface the error into the job
        # summary (readable via the API) and upload the full log as well.
        set +e
        ./gradlew :app:testPlaystoreDebugUnitTest :app:assemblePlaystoreRelease 2>&1 | tee gradle-release.log
        STATUS=${PIPESTATUS[0]}
        set -e
        if [ "$STATUS" -ne 0 ]; then
          {
            echo "## Release build failed (exit $STATUS)"
            echo '```'
            grep -A 30 'What went wrong' gradle-release.log | head -40 || true
            echo '```'
            echo '```'
            grep -E 'Execution failed|FAILED|error:' gradle-release.log | tail -15 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$STATUS"

    - name: Upload Gradle log on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: gradle-release-log
        path: ${{ github.workspace }}/V2rayNG/gradle-release.log

    - name: Upload Release APKs
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: khp-v2ray-vpn-release-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*.apk
